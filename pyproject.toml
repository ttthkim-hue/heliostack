[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "heliostack"
version = "0.1.0"
description = "Deterministic open-source solar PV, 3D ray-cast shading, CFD-informed thermal, and HiGHS LiFePO4 ESS optimization engine with RO-Crate 1.1 audit provenance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Tae-Hyung Kim", email = "ttthkim@gmail.com" },
]
keywords = [
  "solar-pv",
  "photovoltaics",
  "microgrid",
  "energy-storage",
  "open-energy",
  "pvgis",
  "ro-crate",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pandas>=2.2.0",
  "pvlib>=0.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
heliostack = "heliostack.cli:main"

[project.urls]
Homepage = "https://github.com/ttthkim-hue/heliostack"
Issues = "https://github.com/ttthkim-hue/heliostack/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/heliostack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["heliostack"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
