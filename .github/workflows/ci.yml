name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev
      - name: Lint with Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests benchmarks openfoam
      - name: Run unit & benchmark offline test suite
        run: uv run --python ${{ matrix.python-version }} pytest --cov=heliostack --cov-report=term-missing
